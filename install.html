r-radius:15px;background:rgba(3,17,36,.78);border:1px solid rgba(88,184,255,.14);color:#8da9c2;font-size:13px;line-height:1.5}.device b{color:#dff7ff}.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.trust span{text-align:center;padding:11px 5px;border-radius:13px;background:rgba(6,23,45,.7);color:#8fb2cc;font-size:11px}.trust b{display:block;color:#e8f9ff;font-size:12px;margin-bottom:2px}.foot{text-align:center;margin:18px 0 0;color:#55728c;font-size:11px}@media(max-width:480px){main{padding:14px 10px 30px}.shell{padding:24px 16px 19px;border-radius:24px}.brand img{width:56px;height:56px}.trust{grid-template-columns:1fr}}

<body><main><section class="shell">
<div class="brand"><img src="assets/gani-official-v34.png" alt="GANI"><div><b>GANI</b></div></div>
<p class="eyebrow">OFFICIAL GANI DOWNLOAD</p>
<h1>Hal link.<br><em>Qalab kasta.</em></h1>

<p class="foot">GANI</p>
</section></main>
<script>
let deferredPrompt=null, apkReady=false;
const ua=navigator.userAgent||'';
const android=/Android/i.test(ua), ios=/iPhone|iPad|iPod/i.test(ua);
const apk=document.getElementById('androidDownload'), install=document.getElementById('pwaInstall'), open=document.getElementById('openGani'), info=document.getElementById('deviceInfo');
function setMode(){
 if(ios){install.hidden=false;open.hidden=false;apk.hidden=true;install.textContent='How to install GANI ↓';info.innerHTML='<b>iPhone / iPad.</b> GANI wuxuu isla website-kan uga shaqaynayaa web app ahaan. Safari-ga ka dooro Share → Add to Home Screen.';return}
 install.hidden=false;open.hidden=true;apk.hidden=!(android&&apkReady);
 info.innerHTML=deferredPrompt?'<b>Installable device.</b> Taabo Install GANI si browser-ku ugu daro app-ka qalabkan.':'<b>GANI PWA.</b> Taabo Install GANI; haddii browser-ku uusan soo bandhigin prompt, isticmaal menu-ga browser-ka oo dooro Install app / Add to Home screen.';
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;setMode()});
install.addEventListener('click',async()=>{if(!deferredPrompt){info.innerHTML='<b>Install GANI.</b> Fur menu-ga browser-ka oo dooro Install app ama Add to Home screen, kadib ku noqo GANI.';return}await deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;setMode()});
fetch('download/GANI-Android.apk',{method:'HEAD',cache:'no-store'}).then(r=>{apkReady=r.ok;setMode()}).catch(()=>setMode());
setMode();
</script></body></html>
